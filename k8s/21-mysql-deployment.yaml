apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ahu
  labels: {app: mysql}
spec:
  replicas: 1
  # Un seul pod peut monter le volume (RWO) : on remplace, on ne surcharge pas
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      serviceAccountName: cp-app
      containers:
        - name: mysql
          image: ahu/mysql-cp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: cp-secret, key: DB_PASSWORD}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD --silent"]
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD --silent"]
            initialDelaySeconds: 90
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data-cp
