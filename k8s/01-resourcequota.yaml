# Quota global du namespace "ahu" (environnement faible performance)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cp-quota
  namespace: ahu
spec:
  hard:
    pods: "6"
    requests.cpu: 500m
    requests.memory: 768Mi
    limits.cpu: "2"
    limits.memory: 1280Mi
    persistentvolumeclaims: "1"
    requests.storage: 1Gi
    services: "3"
    secrets: "5"
    configmaps: "5"
