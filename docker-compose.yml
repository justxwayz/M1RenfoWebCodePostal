services:
  php:
    build: ./php
    image: ${DOCKER_HUB_USER:-ahu}/php-cp
    ports:
      - ${HTTP_EXT_PORT}:80
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
    volumes:
      - ./php/www:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    build: ./mysql
    image: ${DOCKER_HUB_USER:-ahu}/mysql-cp
    ports:
      - ${HTTP_EXT_MYSQL}:3306
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql-data-cp:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  mysql-data-cp:
